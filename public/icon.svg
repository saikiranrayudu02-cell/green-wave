<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38c4e0"/>
      <stop offset="50%" stop-color="#2fe08a"/>
      <stop offset="100%" stop-color="#38c4e0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38c4e0" stroke-opacity="0.2" stroke-width="6"/>
  <!-- decorative grid lines -->
  <path d="M64 256 H448 M256 64 V448" stroke="#38c4e0" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38c4e0" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="8 8"/>
  <!-- GreenWave pulse path -->
  <path d="M64 300 L160 300 L210 160 L290 380 L350 160 L390 250 L448 250" 
        stroke="url(#wave)" 
        stroke-width="32" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  <!-- Status beacon -->
  <circle cx="410" cy="130" r="28" fill="#2fe08a" filter="url(#glow)"/>
  <circle cx="410" cy="130" r="14" fill="#ffffff"/>
</svg>
